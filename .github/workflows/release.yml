name: Release

# On every version tag push (vX.Y.Z), ensure a GitHub Release exists and attach
# install-weave.sh and install-weave.ps1 as assets, so the documented
# one-liners always resolve:
#   curl -sSL https://github.com/TheWeaveSC/theweave/releases/latest/download/install-weave.sh | bash
#   irm https://github.com/TheWeaveSC/theweave/releases/latest/download/install-weave.ps1 | iex
# The source tarball/zip at /archive/refs/tags/<tag>.* is generated by GitHub
# automatically; only the installer scripts need uploading.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for f in install-weave.sh install-weave.ps1; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found at repo root" >&2
              exit 1
            fi
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating release $tag"
            gh release create "$tag" --title "$tag" --generate-notes
          else
            echo "Release $tag already exists; attaching asset"
          fi
          gh release upload "$tag" install-weave.sh install-weave.ps1 --clobber
          echo "Attached install-weave.sh and install-weave.ps1 to release $tag"
