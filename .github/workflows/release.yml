name: Release

# On every version tag push (vX.Y.Z), ensure a GitHub Release exists and attach
# install-weave.sh as an asset, so the documented one-liner always resolves:
#   curl -sSL https://github.com/TheWeaveSC/theweave/releases/latest/download/install-weave.sh | bash
# The source tarball at /archive/refs/tags/<tag>.tar.gz is generated by GitHub
# automatically; only the installer script needs uploading.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ ! -f install-weave.sh ]; then
            echo "::error::install-weave.sh not found at repo root" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating release $tag"
            gh release create "$tag" --title "$tag" --generate-notes
          else
            echo "Release $tag already exists; attaching asset"
          fi
          gh release upload "$tag" install-weave.sh --clobber
          echo "Attached install-weave.sh to release $tag"
